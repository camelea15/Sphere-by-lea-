<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      .navy { fill: #17387E; }
      .teal { fill: #00A2B3; }
      .white-stroke { fill: none; stroke: #FFFFFF; stroke-linecap: round; stroke-linejoin: round; }
      .white-fill { fill: #FFFFFF; }
      .text-navy {
        font-family: 'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        fill: #17387E;
      }
    </style>
  </defs>

  <!-- Clean Circular Badge Background -->
  <circle cx="500" cy="500" r="490" fill="#FFFFFF" />

  <!-- ==================== TOP NAVY FISH ==================== -->
  <!-- Left fin spine -->
  <path class="navy" d="
    M 215 155
    C 245 130, 285 125, 335 135
    C 310 160, 280 200, 260 250
    C 210 370, 198 490, 235 625
    C 215 550, 195 460, 190 380
    C 185 290, 195 210, 215 155 Z
  " />

  <!-- White thin separation line in outer spine -->
  <path class="white-stroke" stroke-width="10" d="M 265 240 C 225 350, 218 465, 245 565" />

  <!-- Main Navy Fish Body & Head -->
  <path class="navy" d="
    M 335 135
    C 410 115, 520 120, 615 160
    C 690 195, 755 245, 785 305
    C 775 320, 740 330, 700 325
    C 650 320, 580 325, 510 345
    C 460 360, 420 385, 390 415
    C 415 365, 450 325, 490 295
    C 440 290, 395 305, 360 330
    C 345 280, 350 230, 370 190
    C 355 170, 342 152, 335 135 Z
  " />

  <!-- Navy Fish Head White Wave Ornament -->
  <path class="white-stroke" stroke-width="17" d="
    M 495 160
    C 445 185, 425 215, 435 245
    C 445 275, 485 285, 475 315
    C 465 340, 445 350, 420 355
  " />

  <!-- Navy Fish Eye: White Circle with Navy Pupil -->
  <circle cx="615" cy="235" r="28" class="white-fill" />
  <circle cx="616" cy="236" r="14" class="navy" />

  <!-- ==================== BOTTOM TEAL FISH ==================== -->
  <path class="teal" d="
    M 380 320
    C 435 375, 445 440, 420 510
    C 390 580, 330 630, 280 690
    C 265 710, 280 770, 310 805
    C 300 780, 290 750, 295 720
    C 335 755, 390 775, 455 775
    C 545 775, 635 735, 710 665
    C 775 605, 825 550, 880 600
    C 850 618, 825 640, 790 660
    C 740 705, 670 755, 580 775
    C 480 795, 390 785, 310 740
    C 260 710, 230 650, 240 580
    C 255 490, 290 410, 350 345
    C 362 332, 372 325, 380 320 Z
  " />

  <!-- Teal Fish Eye: Solid White Circle -->
  <circle cx="360" cy="415" r="15" class="white-fill" />

  <!-- White Fin Accents on Teal Fish (Hugging under BY LEA text) -->
  <path class="white-fill" d="
    M 430 525
    C 455 540, 480 570, 470 600
    C 490 585, 520 595, 550 630
    C 580 660, 620 670, 675 650
    C 620 645, 570 615, 530 575
    C 490 535, 450 515, 430 525 Z
  " />

  <!-- Pointed Fin on lower left of teal fish -->
  <path class="teal" d="
    M 280 690
    L 310 805
    L 315 745 Z
  " />

  <!-- ==================== CENTER TEXT 'BY LEA' ==================== -->
  <g transform="translate(555, 475) rotate(-37)">
    <text x="0" y="-30" class="text-navy" font-size="92" text-anchor="middle" letter-spacing="6">BY</text>
    <text x="0" y="80" class="text-navy" font-size="140" text-anchor="middle" letter-spacing="8">LEA</text>
  </g>
</svg>